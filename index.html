<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunnel Flap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one full-bleed canvas stage, a single floating sound toggle. Deliberately one dusk look in both host themes. */
  :root {
    --night: #1b1840;
    --plum: #5b2a6e;
    --plum-lit: #9a52b4;
    --peach: #f7a984;
    --lemon: #ffd23f;
    --ink: #fff7ee;
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage { position: relative; height: 100%; }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: pointer;
  }
  #mute {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    font: 800 13px/1 var(--body);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    background: color-mix(in srgb, var(--night) 55%, transparent);
    border: 2px solid color-mix(in srgb, var(--ink) 35%, transparent);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  #mute:hover { border-color: var(--lemon); }
  #mute:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage">

<canvas id="game" aria-label="Tunnel Flap game. Press Space or tap to lift the tunnels."></canvas>
<button id="mute" type="button" aria-pressed="false">Sound on</button>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const muteBtn = document.getElementById('mute');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- world constants ----------
  const H = 640;                 // logical height; width adapts to the screen
  const TW = 76;                 // tunnel body width
  const LIP_W = 90, LIP_H = 26;  // tunnel mouth
  const SPACING = 250;           // horizontal distance between tunnels
  const GRAVITY = 1450;          // tunnels fall at this rate
  const FLAP_V = -470;           // upward kick on a flap
  const MAX_FALL = 680;
  const OFFSET_LIMIT = 290;      // how far the tunnel rack can travel
  const BIRD_R = 15;

  let W = 400, scale = 1, dpr = 1, oy = 0;

  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    scale = Math.min(r.height / H, r.width / 320);
    W = r.width / scale;
    oy = (r.height - H * scale) / 2 / scale;
  }
  addEventListener('resize', resize);
  resize();

  // ---------- storage (best score is a convenience only) ----------
  function loadBest() { try { return +localStorage.getItem('tunnelflap.best') || 0; } catch { return 0; } }
  function saveBest(v) { try { localStorage.setItem('tunnelflap.best', String(v)); } catch {} }

  // ---------- sound ----------
  let ac = null, muted = false;
  function tone(f1, f2, dur, type, vol) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch {}
  }
  const sfx = {
    flap: () => { tone(150, 70, 0.14, 'sine', 0.35); tone(420, 260, 0.06, 'triangle', 0.05); },
    score: () => tone(880, 1400, 0.11, 'square', 0.045),
    hit: () => { tone(320, 50, 0.4, 'sawtooth', 0.09); tone(90, 40, 0.3, 'sine', 0.3); },
  };
  muteBtn.addEventListener('click', e => {
    muted = !muted;
    muteBtn.textContent = muted ? 'Sound off' : 'Sound on';
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.blur();
    e.stopPropagation();
  });

  // ---------- game state ----------
  const G = {
    state: 'ready',   // ready | playing | dead
    t: 0,             // time since run start
    clock: 0,         // always-running clock for idle animation
    offset: 0,        // shared vertical offset of every tunnel
    vel: 0,
    tunnels: [],
    score: 0,
    best: loadBest(),
    deadAt: 0,
    pulse: 0,         // flap squash animation, 1 -> 0
    shake: 0,
    scroll: 0,        // total distance travelled, for parallax
    bird: { y: H / 2, vy: 0, rot: 0 },
    particles: [],
    newBest: false,
  };

  const birdX = () => Math.min(W * 0.3, 150);
  const difficulty = s => ({
    gap: Math.max(132, 186 - s * 2.4),
    spread: Math.min(175, 55 + s * 6),
    speed: Math.min(245, 150 + s * 3),
    amp: Math.min(75, s * 3.2),
  });

  function birdBaseY() {
    const d = difficulty(G.score);
    return H / 2 + Math.sin(G.t * 1.7) * d.amp + Math.sin(G.clock * 3.1) * 5;
  }

  function spawnTunnel(x) {
    const d = difficulty(G.score);
    const prev = G.tunnels.length ? G.tunnels[G.tunnels.length - 1].gc : H / 2;
    let gc = H / 2 + (Math.random() * 2 - 1) * d.spread;
    // keep consecutive gaps from being trivially identical
    if (Math.abs(gc - prev) < 30) gc += (gc > H / 2 ? -1 : 1) * 40;
    G.tunnels.push({ x, gc, gap: d.gap, passed: false });
  }

  function reset() {
    G.state = 'ready';
    G.t = 0; G.offset = 0; G.vel = 0; G.score = 0;
    G.tunnels = []; G.particles = []; G.pulse = 0; G.newBest = false;
    G.bird.vy = 0; G.bird.rot = 0;
  }

  function start() {
    reset();
    G.state = 'playing';
    spawnTunnel(W + 60);
  }

  function flap() {
    if (G.state === 'ready') start();
    if (G.state === 'dead') {
      if (G.clock - G.deadAt < 0.55) return;
      start();
    }
    G.vel = FLAP_V;
    G.pulse = 1;
    sfx.flap();
    // dust puffs from every visible tunnel mouth
    for (const tn of G.tunnels) {
      if (tn.x < -LIP_W || tn.x > W) continue;
      const top = tn.gc + G.offset - tn.gap / 2;
      const bot = tn.gc + G.offset + tn.gap / 2;
      for (let i = 0; i < 4; i++) {
        puff(tn.x + TW / 2 + (Math.random() - 0.5) * LIP_W, bot + LIP_H, 'dust');
        if (i < 2) puff(tn.x + TW / 2 + (Math.random() - 0.5) * LIP_W, top - LIP_H, 'dust');
      }
    }
  }

  function puff(x, y, kind) {
    const a = Math.random() * Math.PI * 2;
    const sp = kind === 'feather' ? 60 + Math.random() * 120 : 20 + Math.random() * 50;
    G.particles.push({
      x, y, kind,
      vx: Math.cos(a) * sp - (kind === 'dust' ? 40 : 0),
      vy: Math.sin(a) * sp + (kind === 'dust' ? 30 : 0),
      life: 1, decay: kind === 'feather' ? 0.9 : 1.8,
      r: kind === 'feather' ? 3 + Math.random() * 3 : 4 + Math.random() * 6,
      spin: Math.random() * 6,
    });
  }

  function die() {
    G.state = 'dead';
    G.deadAt = G.clock;
    G.bird.vy = -320;
    G.shake = reduceMotion ? 0 : 1;
    sfx.hit();
    for (let i = 0; i < 14; i++) puff(birdX(), G.bird.y, 'feather');
    if (G.score > G.best) { G.best = G.score; G.newBest = true; saveBest(G.best); }
  }

  function circleHitsRect(cx, cy, r, x, y, w, h) {
    const nx = Math.max(x, Math.min(cx, x + w));
    const ny = Math.max(y, Math.min(cy, y + h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  // ---------- update ----------
  function update(dt) {
    G.clock += dt;
    G.pulse = Math.max(0, G.pulse - dt * 4);
    G.shake = Math.max(0, G.shake - dt * 2.5);
    const d = difficulty(G.score);
    const bx = birdX();

    if (G.state === 'ready') {
      G.scroll += 60 * dt;
      G.bird.y = H / 2 + Math.sin(G.clock * 3.1) * 8;
    }

    if (G.state === 'playing') {
      G.t += dt;
      G.scroll += d.speed * dt;

      // the tunnels are the ones with gravity
      G.vel = Math.min(MAX_FALL, G.vel + GRAVITY * dt);
      G.offset += G.vel * dt;
      if (G.offset > OFFSET_LIMIT) { G.offset = OFFSET_LIMIT; G.vel = 0; }
      if (G.offset < -OFFSET_LIMIT) { G.offset = -OFFSET_LIMIT; G.vel = Math.max(0, G.vel); }

      for (const tn of G.tunnels) tn.x -= d.speed * dt;
      const last = G.tunnels[G.tunnels.length - 1];
      if (last.x < W + 60 - SPACING) spawnTunnel(last.x + SPACING);
      while (G.tunnels.length && G.tunnels[0].x < -LIP_W - 20) G.tunnels.shift();

      const prevY = G.bird.y;
      G.bird.y = birdBaseY();
      G.bird.rot = Math.max(-0.5, Math.min(0.5, (G.bird.y - prevY) / dt / 300));

      for (const tn of G.tunnels) {
        const top = tn.gc + G.offset - tn.gap / 2;
        const bot = tn.gc + G.offset + tn.gap / 2;
        const lx = tn.x + TW / 2 - LIP_W / 2;
        const hit =
          circleHitsRect(bx, G.bird.y, BIRD_R, tn.x, -2000, TW, top + 2000) ||
          circleHitsRect(bx, G.bird.y, BIRD_R, lx, top - LIP_H, LIP_W, LIP_H) ||
          circleHitsRect(bx, G.bird.y, BIRD_R, tn.x, bot, TW, 4000) ||
          circleHitsRect(bx, G.bird.y, BIRD_R, lx, bot, LIP_W, LIP_H);
        if (hit) { die(); break; }
        if (!tn.passed && tn.x + TW < bx - BIRD_R) {
          tn.passed = true;
          G.score++;
          sfx.score();
          for (let i = 0; i < 5; i++) puff(bx, G.bird.y, 'spark');
        }
      }
    }

    if (G.state === 'dead') {
      G.bird.vy += 1700 * dt;
      G.bird.y = Math.min(H + 200, G.bird.y + G.bird.vy * dt);
      G.bird.rot += dt * 7;
    }

    for (const p of G.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.kind === 'feather' ? 160 : p.kind === 'spark' ? -40 : 20) * dt;
      p.vx *= 0.98;
      p.life -= p.decay * dt;
      p.spin += dt * 4;
    }
    G.particles = G.particles.filter(p => p.life > 0);
  }

  // ---------- drawing ----------
  const stars = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random() * 0.45, r: Math.random() * 1.4 + 0.3, tw: Math.random() * 6 }));
  const clouds = Array.from({ length: 6 }, (_, i) => ({ x: i * 260 + Math.random() * 120, y: 90 + Math.random() * 200, s: 0.6 + Math.random() * 0.7 }));

  function drawSky() {
    const top = -oy - 4, bottom = H + oy + 4;
    const g = ctx.createLinearGradient(0, top, 0, bottom);
    g.addColorStop(0, '#1b1840');
    g.addColorStop(0.45, '#4b2c6b');
    g.addColorStop(0.72, '#c45d7c');
    g.addColorStop(1, '#f7a984');
    ctx.fillStyle = g;
    ctx.fillRect(-4, top, W + 8, bottom - top);

    for (const s of stars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(G.clock * 1.5 + s.tw);
      ctx.fillStyle = '#fff7ee';
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // low sun
    const sx = W * 0.72, sy = H * 0.74;
    const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 190);
    sg.addColorStop(0, 'rgba(255,214,140,0.9)');
    sg.addColorStop(0.35, 'rgba(255,190,130,0.35)');
    sg.addColorStop(1, 'rgba(255,170,120,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(sx - 200, sy - 200, 400, 400);
    ctx.fillStyle = '#ffd99a';
    ctx.beginPath(); ctx.arc(sx, sy, 58, 0, Math.PI * 2); ctx.fill();

    // drifting clouds
    ctx.fillStyle = 'rgba(255,220,214,0.16)';
    for (const c of clouds) {
      const span = Math.max(W + 300, 1560);
      const x = ((c.x - G.scroll * 0.15) % span + span) % span - 150;
      cloud(x, c.y, c.s);
    }

    hills(0.3, 470, 46, '#3a2257', 0.004);
    hills(0.55, 530, 34, '#2a1a45', 0.007);
    ctx.fillStyle = '#1f1436';
    ctx.fillRect(-4, 585, W + 8, H + oy + 10 - 585);
  }

  function cloud(x, y, s) {
    ctx.beginPath();
    ctx.ellipse(x, y, 60 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 30 * s, y - 10 * s, 36 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 26 * s, y - 6 * s, 28 * s, 12 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function hills(par, base, amp, color, freq) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-4, H + oy + 10);
    const sh = G.scroll * par;
    for (let x = -4; x <= W + 8; x += 8) {
      const u = x + sh;
      const y = base - amp * (0.6 * Math.sin(u * freq) + 0.4 * Math.sin(u * freq * 2.3 + 1.7));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 8, H + oy + 10);
    ctx.closePath();
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  }

  function drawTunnel(tn) {
    const p = G.pulse;
    const stretch = p * 10;          // mouths flare when you flap
    const lipW = LIP_W + p * 8;
    const top = tn.gc + G.offset - tn.gap / 2;
    const bot = tn.gc + G.offset + tn.gap / 2;
    const cx = tn.x + TW / 2;
    const farTop = -oy - 40, farBot = H + oy + 40;

    const body = ctx.createLinearGradient(tn.x, 0, tn.x + TW, 0);
    body.addColorStop(0, '#46205a');
    body.addColorStop(0.22, '#9a52b4');
    body.addColorStop(0.42, '#6e3486');
    body.addColorStop(1, '#3a1a4c');

    // shafts
    ctx.fillStyle = body;
    ctx.fillRect(tn.x, farTop, TW, top - LIP_H - farTop);
    ctx.fillRect(tn.x, bot + LIP_H, TW, farBot - bot - LIP_H);

    // ribs scroll with the rack so the motion reads
    ctx.strokeStyle = 'rgba(20,6,30,0.35)';
    ctx.lineWidth = 3;
    const ribStep = 30;
    const phase = ((G.offset % ribStep) + ribStep) % ribStep;
    ctx.beginPath();
    for (let y = top - LIP_H - phase - 8; y > farTop; y -= ribStep) { ctx.moveTo(tn.x + 3, y); ctx.lineTo(tn.x + TW - 3, y); }
    for (let y = bot + LIP_H + ribStep - phase + 8; y < farBot; y += ribStep) { ctx.moveTo(tn.x + 3, y); ctx.lineTo(tn.x + TW - 3, y); }
    ctx.stroke();

    // mouths
    const lip = ctx.createLinearGradient(cx - lipW / 2, 0, cx + lipW / 2, 0);
    lip.addColorStop(0, '#5b2a6e');
    lip.addColorStop(0.2, '#c07ad6');
    lip.addColorStop(0.45, '#8a45a3');
    lip.addColorStop(1, '#4a2160');
    ctx.fillStyle = lip;
    roundRect(cx - lipW / 2, top - LIP_H - stretch * 0.3, lipW, LIP_H + stretch * 0.3, 8); ctx.fill();
    roundRect(cx - lipW / 2, bot, lipW, LIP_H + stretch * 0.3, 8); ctx.fill();

    // inner shadow at the opening
    ctx.fillStyle = 'rgba(20,6,30,0.45)';
    ctx.fillRect(cx - lipW / 2 + 6, top - 5, lipW - 12, 5);
    ctx.fillRect(cx - lipW / 2 + 6, bot, lipW - 12, 5);

    // the little glowing marker on each mouth: gap you need to hit
    ctx.fillStyle = 'rgba(255,210,63,0.9)';
    ctx.beginPath(); ctx.arc(cx, top - LIP_H / 2, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, bot + LIP_H / 2, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  function nextGapY() {
    const bx = birdX();
    const tn = G.tunnels.find(t => t.x + TW > bx - BIRD_R);
    return tn ? tn.gc + G.offset : null;
  }

  function drawBird() {
    const bx = birdX(), by = G.bird.y;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(G.bird.rot);

    // body
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.ellipse(0, 0, BIRD_R + 3, BIRD_R, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath(); ctx.ellipse(-2, 5, 11, 7, 0, 0, Math.PI * 2); ctx.fill();

    // wing flutters on its own: the bird never stops flying
    const w = Math.sin(G.clock * (G.state === 'dead' ? 4 : 22));
    ctx.fillStyle = '#f2a516';
    ctx.beginPath();
    ctx.ellipse(-7, 1 + w * 3, 9, 5 + w * 2.5, -0.3 + w * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#ff7a3d';
    ctx.beginPath(); ctx.moveTo(15, -3); ctx.lineTo(26, 1); ctx.lineTo(15, 5); ctx.closePath(); ctx.fill();

    // eye watches the gap it is about to fly into
    let look = 0;
    const gy = nextGapY();
    if (G.state === 'playing' && gy !== null) look = Math.max(-1, Math.min(1, (gy - by) / 80));
    ctx.fillStyle = '#fff7ee';
    ctx.beginPath(); ctx.arc(7, -5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b1840';
    if (G.state === 'dead') {
      ctx.strokeStyle = '#1b1840'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(4, -8); ctx.lineTo(10, -2); ctx.moveTo(10, -8); ctx.lineTo(4, -2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(9, -5 + look * 2.6, 2.8, 0, Math.PI * 2); ctx.fill();
    }
    // worried brow when the gap is far off
    if (G.state === 'playing' && Math.abs(look) > 0.85) {
      ctx.strokeStyle = '#a0600c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(2, -13); ctx.lineTo(12, -11.5); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of G.particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.kind === 'dust') {
        ctx.fillStyle = '#e9c3e8';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.4 - p.life * 0.4), 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'feather') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin);
        ctx.fillStyle = '#ffd23f';
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.8, p.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = '#fff2b0';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.6, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, opts = {}) {
    ctx.font = `${opts.weight || ''} ${size}px ${opts.font || 'Lilita One, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif'}`;
    ctx.textAlign = opts.align || 'center';
    ctx.textBaseline = 'middle';
    if (opts.shadow !== false) {
      ctx.fillStyle = 'rgba(27,24,64,0.75)';
      ctx.fillText(str, x, y + Math.max(2, size * 0.07));
    }
    ctx.fillStyle = opts.color || '#fff7ee';
    ctx.fillText(str, x, y);
  }
  const BODY_FONT = 'Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif';

  function drawHUD() {
    const cx = W / 2;
    if (G.state === 'playing') {
      text(String(G.score), cx, 74, 64);
    }
    if (G.state === 'ready') {
      text('Tunnel Flap', cx, 150, 56);
      text('The bird can’t steer.', cx, 205, 19, { font: BODY_FONT, weight: 800, shadow: false, color: '#ffe3d2' });
      text('You flap the tunnels instead.', cx, 230, 19, { font: BODY_FONT, weight: 800, shadow: false, color: '#ffe3d2' });
      const blink = 0.6 + 0.4 * Math.sin(G.clock * 4);
      ctx.globalAlpha = blink;
      text('Tap, click or press Space', cx, 430, 22, { color: '#ffd23f' });
      ctx.globalAlpha = 1;
      text('Tunnels fall on their own. Each flap lifts them all.', cx, 466, 14, { font: BODY_FONT, weight: 600, shadow: false, color: '#ffe3d2' });
      if (G.best) text('Best ' + G.best, cx, 500, 16, { font: BODY_FONT, weight: 800, shadow: false, color: '#ffe3d2' });
    }
    if (G.state === 'dead') {
      const pw = Math.min(280, W - 40), ph = 210, px = cx - pw / 2, py = 170;
      ctx.fillStyle = 'rgba(27,24,64,0.82)';
      roundRect(px, py, pw, ph, 22); ctx.fill();
      ctx.strokeStyle = 'rgba(255,210,63,0.6)'; ctx.lineWidth = 2;
      roundRect(px, py, pw, ph, 22); ctx.stroke();
      text('Tunnel jam!', cx, py + 40, 34);
      text('Score', cx - pw / 4, py + 86, 14, { font: BODY_FONT, weight: 800, shadow: false, color: '#ffe3d2' });
      text('Best', cx + pw / 4, py + 86, 14, { font: BODY_FONT, weight: 800, shadow: false, color: '#ffe3d2' });
      text(String(G.score), cx - pw / 4, py + 120, 42, { shadow: false });
      text(String(G.best), cx + pw / 4, py + 120, 42, { shadow: false, color: G.newBest ? '#ffd23f' : '#fff7ee' });
      if (G.newBest) text('New best', cx + pw / 4, py + 150, 12, { font: BODY_FONT, weight: 800, shadow: false, color: '#ffd23f' });
      if (G.clock - G.deadAt > 0.55) {
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(G.clock * 4);
        text('Tap to fly again', cx, py + ph - 26, 18, { color: '#ffd23f', shadow: false });
        ctx.globalAlpha = 1;
      }
    }
  }

  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, dpr * scale * oy);
    const s = G.shake * G.shake * 10;
    if (s) ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    drawSky();
    for (const tn of G.tunnels) drawTunnel(tn);
    drawParticles();
    drawBird();
    drawHUD();
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) flap();
    }
  });

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function boot(data) {
    if (data && data.best > G.best) G.best = data.best;
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  window.claude?.hot?.snapshot?.(() => ({ best: G.best }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
